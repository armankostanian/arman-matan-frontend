<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Арман Матан</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --text: #000000;
    --text-secondary: #6e6e73;
    --accent: #000000;
    --accent-text: #ffffff;
    --card-bg: #f5f5f7;
    --border: #d2d2d7;
    --error: #ff3b30;
    --radius: 14px;
  }

  body {
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  .container { max-width: 440px; margin: 0 auto; padding: 20px 20px 40px; }

  .header { text-align: center; padding: 24px 0 20px; }
  .logo { font-size: 42px; margin-bottom: 8px; }
  .brand { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
  .tagline { font-size: 15px; color: var(--text-secondary); line-height: 1.4; }

  .product-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
  }
  .product-title { font-size: 18px; font-weight: 600; line-height: 1.35; margin-bottom: 10px; }
  .product-meta { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; font-weight: 500; color: var(--text-secondary);
    background: var(--bg); padding: 4px 10px; border-radius: 8px;
  }
  .product-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 16px; }
  .product-includes { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
  .product-includes span { display: block; }
  .price-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .price { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .price-note { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .email-section { margin-bottom: 14px; }
  .email-label {
    display: block; font-size: 13px; color: var(--text-secondary);
    margin-bottom: 6px; padding-left: 4px;
  }
  .email-input {
    width: 100%; padding: 14px 16px; font-size: 16px;
    font-family: inherit; color: var(--text);
    background: var(--card-bg); border: 1.5px solid transparent;
    border-radius: var(--radius); outline: none;
    transition: border-color 0.15s;
  }
  .email-input:focus { border-color: var(--accent); }
  .email-input::placeholder { color: var(--text-secondary); }

  .btn-buy {
    display: block; width: 100%; padding: 17px;
    font-size: 17px; font-weight: 600;
    color: var(--accent-text); background: var(--accent);
    border: none; border-radius: var(--radius); cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .btn-buy:active { opacity: 0.7; transform: scale(0.98); }
  .btn-buy:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    display: block; width: 100%; padding: 15px;
    font-size: 15px; font-weight: 600;
    color: var(--text); background: var(--card-bg);
    border: none; border-radius: var(--radius); cursor: pointer;
    margin-top: 10px; transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .btn-secondary:active { opacity: 0.6; }

  .screen { display: none; }
  .screen.active { display: block; }

  .loading-text {
    text-align: center; font-size: 15px;
    color: var(--text-secondary); padding: 40px 0;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .success-icon { font-size: 64px; text-align: center; margin-bottom: 16px; padding-top: 40px; }
  .success-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
  .success-text {
    font-size: 15px; color: var(--text-secondary);
    text-align: center; line-height: 1.5; margin-bottom: 32px;
  }

  .error-box {
    background: #fff2f2; border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px; text-align: center;
  }
  .error-box p { font-size: 14px; color: var(--error); line-height: 1.4; }

  .footer {
    text-align: center; padding: 20px 0 8px;
    font-size: 12px; color: var(--text-secondary);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">

  <div id="screen-shop" class="screen active">
    <div class="header">
      <div class="logo">📐</div>
      <div class="brand">Арман Матан</div>
      <div class="tagline">Олимпиадная математика для школьников</div>
    </div>

    <div class="product-card" id="product-list"></div>

    <div class="email-section">
      <label class="email-label" for="email-input">Email для чека (необязательно)</label>
      <input
        type="email"
        id="email-input"
        class="email-input"
        placeholder="your@email.ru"
        autocomplete="email"
        inputmode="email"
      >
    </div>

    <div id="error-container"></div>

    <button class="btn-buy" id="btn-buy" onclick="startPurchase()">
      Купить за 99 ₽
    </button>

    <div class="footer">
      После оплаты задачник и чек придут<br>
      в чат с ботом @armanmatan_bot
    </div>
  </div>

  <div id="screen-loading" class="screen">
    <div class="header">
      <div class="logo">📐</div>
      <div class="brand">Арман Матан</div>
    </div>
    <div class="loading-text">
      <div class="spinner"></div>
      Создаём платёж…
    </div>
  </div>

  <div id="screen-success" class="screen">
    <div class="success-icon">✅</div>
    <div class="success-title">Задачник отправлен!</div>
    <div class="success-text">
      Откройте чат с @armanmatan_bot —<br>
      там вас ждёт PDF и чек.
    </div>
    <button class="btn-buy" onclick="closeApp()">Перейти в чат</button>
    <button class="btn-secondary" onclick="shareApp()">Поделиться с друзьями</button>
  </div>

</div>

<script>
/* ============================================================
   ⚠️ ВАЖНО: замените на URL вашего backend
   ============================================================ */
const API_BASE = 'https://armanmatanapi-armankostanyan.amvera.io';

const PRODUCTS = [
  {
    id: 'math_olymp_2_7',
    title: 'Сборник олимпиадных задач по математике для 2–7 классов',
    subtitle: 'Математические разнобои',
    description: 'Более 200 нестандартных задач с подробными решениями. Для подготовки к олимпиадам и развития математического мышления.',
    badges: ['2–7 класс', 'PDF', '200+ задач'],
    includes: [
      '✓ Задачи на логику и комбинаторику',
      '✓ Геометрические головоломки',
      '✓ Числовые ребусы',
      '✓ Подробные решения'
    ],
    price: 99,
    currency: '₽'
  }
];

let selectedProduct = PRODUCTS[0];

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  tg.disableVerticalSwipes?.();
  if (tg.colorScheme === 'dark') {
    const r = document.documentElement.style;
    r.setProperty('--bg', '#1c1c1e');
    r.setProperty('--text', '#ffffff');
    r.setProperty('--text-secondary', '#98989f');
    r.setProperty('--card-bg', '#2c2c2e');
    r.setProperty('--border', '#3a3a3c');
    r.setProperty('--accent', '#ffffff');
    r.setProperty('--accent-text', '#000000');
  }
}

function renderProducts() {
  const container = document.getElementById('product-list');
  const p = selectedProduct;
  container.innerHTML = `
    <div class="product-title">${p.title}</div>
    <div class="product-meta">
      ${p.badges.map(b => `<span class="badge">${b}</span>`).join('')}
    </div>
    <div class="product-desc">${p.description}</div>
    <div class="product-includes">
      ${p.includes.map(i => `<span>${i}</span>`).join('')}
    </div>
    <div class="price-row">
      <div>
        <span class="price">${p.price} ${p.currency}</span>
        <div class="price-note">Разовая покупка · Без подписки</div>
      </div>
    </div>
  `;
  document.getElementById('btn-buy').textContent = `Купить за ${p.price} ${p.currency}`;
}
renderProducts();

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

function showError(msg) {
  const c = document.getElementById('error-container');
  c.innerHTML = `<div class="error-box"><p>${msg}</p></div>`;
  setTimeout(() => { c.innerHTML = ''; }, 6000);
}

function validateEmail(email) {
  return !email || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function startPurchase() {
  if (!tg) {
    showError('Откройте приложение через Telegram-бота @armanmatan_bot');
    return;
  }

  const initData = tg.initData;
  if (!initData) {
    showError('Нет данных авторизации. Откройте приложение через бота.');
    return;
  }

  const email = document.getElementById('email-input').value.trim();
  if (!validateEmail(email)) {
    showError('Введите корректный email или оставьте поле пустым');
    return;
  }

  if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  showScreen('loading');

  try {
    const res = await fetch(API_BASE + '/api/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        product_id: selectedProduct.id,
        init_data: initData,
        email: email || null
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Ошибка сервера');
    }

    if (data.already_purchased) {
      showScreen('success');
      return;
    }

    if (data.confirmation_url) {
      window.location.href = data.confirmation_url;
    } else {
      throw new Error('Не получили ссылку на оплату');
    }

  } catch (err) {
    showScreen('shop');
    showError(err.message || 'Произошла ошибка, попробуйте ещё раз');
  }
}

(function checkReturn() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('payment') === 'success') {
    showScreen('success');
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } else if (params.get('payment') === 'fail') {
    showError('Оплата не прошла. Попробуйте ещё раз.');
  }
})();

function closeApp() {
  if (tg) tg.close();
}

function shareApp() {
  if (tg) {
    tg.switchInlineQuery(
      'Олимпиадный задачник по математике для 2-7 классов 📐',
      ['users', 'groups']
    );
  }
}
</script>

</body>
</html>
